name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please run `bash bin/polymath doctor` first and paste the output — it captures the env state we need to triage.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `polymath doctor`
      description: Paste the full output here. The doctor reports OS, bash version, dep versions, and config-wiring state.
      placeholder: "Pair Polymath doctor..."
      render: text
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered list of commands / actions
      placeholder: |
        1. git clone ...
        2. ./bin/install.sh
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pair Polymath version (or commit SHA)
      description: Output of `cat VERSION` or `git rev-parse --short HEAD`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Ubuntu / Debian
        - WSL
        - Other Linux
        - Other
    validations:
      required: true
