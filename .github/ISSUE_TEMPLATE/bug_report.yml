name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! If `polymath doctor` runs on your machine, paste its output below — it captures everything we need to triage in one shot. If `polymath` itself won't run (install/bootstrap bug), skip that field and use the "Bootstrap failure" section instead.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `polymath doctor`
      description: Run `bash bin/polymath doctor` and paste the full output. Skip if doctor itself crashes — fill the "Bootstrap failure" field below.
      placeholder: "Pair Polymath doctor..."
      render: text
    validations:
      required: false
  - type: textarea
    id: bootstrap
    attributes:
      label: Bootstrap failure (only if `polymath doctor` won't run)
      description: |
        Paste the relevant output. Examples we need:
        - `bash --version` and `command -v jq llm git`
        - The exact error from `bash bin/polymath ...` or `./bin/install.sh`
        - Last 20 lines of `~/.claude/pair-polymath/install.log` if present
      render: text
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered list of commands / actions
      placeholder: |
        1. git clone ...
        2. ./bin/install.sh
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pair Polymath version (or commit SHA)
      description: Output of `cat VERSION` or `git rev-parse --short HEAD`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Ubuntu / Debian
        - WSL
        - Other Linux
        - Other
    validations:
      required: true
