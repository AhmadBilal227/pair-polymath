name: bats

on:
  push:
    branches-ignore: ['gh-pages']
    tags-ignore: ['**']        # tag pushes already covered by the main commit; avoid duplicate runs
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run bats
        run: bats test/
