name: install-test

on:
  push:
    branches-ignore: ['gh-pages']
    tags-ignore: ['**']        # tag pushes already covered by the main commit; avoid duplicate runs
  pull_request:
    branches: [main]

# Permissions: this workflow only reads the repo and writes to a temp HOME.
# No deploy / no secret access. If you add OpenAI-key-bearing tests, gate them
# behind `if: github.actor == github.repository_owner` and put the key in a
# secret.
permissions:
  contents: read

jobs:
  # End-to-end install on a clean Ubuntu runner. Verifies the installer can
  # actually install missing deps via sudo apt-get + pip3 --user, merge
  # settings.json, and produce a doctor-passable state — none of which is
  # exercised by the macOS dev loop.
  install-clean-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Force a clean baseline (review fix H1+M1)
        # ubuntu-latest ships with jq pre-installed; remove it so the installer
        # always sees the "jq absent" path and exercises its own apt-get logic.
        # We intentionally do NOT pre-warm apt-get update — the installer's
        # own apt-get install needs to handle that itself.
        run: |
          set -euo pipefail
          sudo apt-get remove -y jq >/dev/null 2>&1 || true
          echo "bash: $(bash --version | head -1)"
          echo "jq pre-install: $(command -v jq || echo absent)"
          echo "llm pre-install: $(command -v llm || echo absent)"
          test ! -e "$HOME/.claude" || (echo "$HOME/.claude unexpectedly exists" && exit 1)

      - name: Run installer non-interactively (P2.3 --yes)
        # P2.3 added --yes; we no longer need to feed answers via stdin.
        run: |
          set -euo pipefail
          bash ./bin/install.sh --yes
          # Make pip3 --user binary visible to subsequent steps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Audit log written + valid JSONL (P2.3)
        run: |
          set -euo pipefail
          log="$HOME/.claude/pair-polymath/install.log"
          test -f "$log"
          # Every line is valid JSON.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" | jq -e . >/dev/null
          done < "$log"
          # Key actions present.
          # Review fix MEDIUM-3: jq | grep is pipefail-sensitive — grep -q
          # closes the pipe on first match, SIGPIPE'ing jq which would then
          # be reported as a failure under `set -o pipefail`. jq -e 'select'
          # exits 0 if any input line matches.
          jq -e 'select(.action == "install-start")'    < "$log" >/dev/null
          jq -e 'select(.action == "install-complete")' < "$log" >/dev/null
          jq -e 'select(.action == "settings-merge")'   < "$log" >/dev/null
          jq -e 'select(.action == "smoke-test")'       < "$log" >/dev/null

      - name: Validate ~/.claude/settings.json structure
        run: |
          set -euo pipefail
          test -f "$HOME/.claude/settings.json"
          jq empty "$HOME/.claude/settings.json"
          # statusLine points at OUR script (strict path match — same logic as doctor)
          jq -e '.statusLine.command | test("bin/statusline\\.sh")' "$HOME/.claude/settings.json" >/dev/null
          # Both hooks installed
          jq -e '[.hooks.UserPromptSubmit[]?.hooks[]?.command] | any(test("hooks/inject-monitor-insight\\.sh"))' "$HOME/.claude/settings.json" >/dev/null
          jq -e '[.hooks.PostToolUse[]?.hooks[]?.command]      | any(test("hooks/cache-test-result\\.sh"))'      "$HOME/.claude/settings.json" >/dev/null

      - name: Validate user override dir + permissions
        run: |
          set -euo pipefail
          test -d "$HOME/.claude/pair-polymath/lenses"
          test -d "$HOME/.claude/pair-polymath/prompts"
          test -d "$HOME/.claude/pair-polymath/cache"
          test -d "$HOME/.claude/pair-polymath/config"
          test -f "$HOME/.claude/pair-polymath/config/user.env"
          # 0700 enforced by installer (chmod 700 || true). We only accept 700.
          mode=$(stat -c '%a' "$HOME/.claude/pair-polymath")
          case "$mode" in 700|0700) : ;; *) echo "unexpected mode $mode (want 700)"; exit 1 ;; esac

      - name: Run polymath doctor (non-network)
        # Doctor will report openai key MISSING → red (we skipped the prompt
        # intentionally under --yes). That's expected for CI without secrets.
        run: |
          set -uo pipefail
          out=$(bash ./bin/polymath doctor 2>&1) || true
          echo "$out"
          echo "$out" | grep -q 'Pair Polymath doctor'
          echo "$out" | grep -q 'jq'
          echo "$out" | grep -q 'lenses'
          echo "$out" | grep -q '6/6 built-in present'
          echo "$out" | grep -q 'Summary:'
          echo "$out" | grep -E 'statusLine wired.*(→|PP_ROOT)' >/dev/null \
            || (echo "doctor did not detect our statusLine" && exit 1)
          echo "$out" | grep -F 'UserPromptSubmit + PostToolUse' >/dev/null \
            || (echo "doctor did not detect our hooks" && exit 1)

      - name: Install bats (test harness only — installs AFTER installer runs
          so that installer's own apt-get update is the one under test; review
          fix M1)
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run bats suite on Ubuntu
        # The macOS dev loop runs bash 3.2; CI runs bash 5.x. Catches features
        # that work on one and not the other.
        run: bats test/

      - name: Smoke statusline against fixture
        run: |
          set -euo pipefail
          cat test/fixtures/stdin-sample.json | bash bin/statusline.sh > /tmp/sl.out 2> /tmp/sl.err
          test -s /tmp/sl.out
          if [ -s /tmp/sl.err ]; then
            echo "unexpected stderr:"
            cat /tmp/sl.err
            exit 1
          fi

      - name: Run uninstaller and verify clean state
        run: |
          set -euo pipefail
          # 'n' to the "remove user dir + cache?" prompt — keep cache/config
          printf 'n\n' | bash ./bin/uninstall.sh
          jq -e '.statusLine == null' "$HOME/.claude/settings.json" >/dev/null
          jq -e '[.hooks.UserPromptSubmit[]?.hooks[]?.command] | any(test("inject-monitor-insight")) | not' "$HOME/.claude/settings.json" >/dev/null
          jq -e '[.hooks.PostToolUse[]?.hooks[]?.command]      | any(test("cache-test-result"))      | not' "$HOME/.claude/settings.json" >/dev/null
          test -d "$HOME/.claude/pair-polymath"

  # Second job: --dry-run produces ZERO filesystem changes. Asserted by
  # diffing find output before/after. Also asserts [DRY-RUN] markers in output.
  install-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Ensure jq present for the dry-run path to reach completion
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y jq
          # llm isn't strictly needed in dry-run (no real `llm keys list` runs),
          # but the installer's `command -v llm` check happens before
          # dep-install for the present case. Stub it via PATH if absent so the
          # dry-run completes the OpenAI-key check without false trips.
          if ! command -v llm >/dev/null 2>&1; then
            # Minimal stub: just need `command -v llm` to succeed in dry-run.
            mkdir -p "$HOME/.local/bin"
            printf '#!/usr/bin/env bash\nexit 0\n' > "$HOME/.local/bin/llm"
            chmod +x "$HOME/.local/bin/llm"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Dry-run produces no FS changes
        # Review fix MEDIUM-4: snapshot ALL paths the installer might touch
        # — not just $HOME/.claude. pip3 --user lands files under $HOME/.local
        # and $HOME/.local/share, and llm CLI may also place config under
        # $HOME/.config. Any unexpected file under those paths is a real bug.
        #
        # Issue #14 Phase 1: always surface diagnostics. The previous version
        # swallowed /tmp/dry-run.log on failure so we couldn't see WHICH of the
        # three assertions tripped or what the installer actually printed.
        #
        # Issue #14 Phase 2 root cause: GitHub's default `run:` shell is
        # `bash --noprofile --norc -eo pipefail {0}`. On the fresh Ubuntu
        # runner, $HOME/.local/bin, $HOME/.local/share, and $HOME/.config may
        # not exist — `find` then exits non-zero, and `... | sort` with
        # -o pipefail propagates that, so `home_before=$(snapshot)` aborts
        # under -e BEFORE any echo runs. macOS (where the runner user owns
        # those paths from prior tooling) never tripped this. Fix: ensure
        # the paths exist before snapshotting, and don't let stderr-suppressed
        # find failures break the pipeline.
        run: |
          # NOTE (review fix LOW-3): we use `set -uo pipefail` here without
          # `-e`. Trade-off: the diagnostic phase that sets up the baseline
          # snapshot (mkdir / find) should not abort the whole step on a
          # transient non-zero — we want the dry-run assertions below to run
          # regardless and report what actually went wrong. The assertions
          # themselves check `install_rc` and `$fail` explicitly so we don't
          # lose failure signal. Worth revisiting if setup ever silently
          # masks a real bug.
          set -uo pipefail
          # Review fix MEDIUM-1: only pre-create the path the installer is
          # expected to touch ($HOME/.claude). If we pre-created
          # $HOME/.local/bin / share / .config before the snapshot, any new
          # dir the installer mkdir'd under those would be missed (baseline
          # and post-install snapshot would both contain the empty dir, diff
          # would be silent). Leaving them absent forces honest detection.
          mkdir -p "$HOME/.claude"
          snapshot() {
            # `find -L` follows symlinks. Each path is conditional: tested
            # -e first so missing roots produce zero output without `find`
            # exiting non-zero. This keeps the snapshot honest about what's
            # actually on disk (vs. silently pre-creating roots which would
            # hide installer-created subtrees).
            for root in "$HOME/.claude" "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config"; do
              [ -e "$root" ] && find "$root" -mindepth 1 2>/dev/null
            done | sort
          }
          home_before=$(snapshot)
          echo "=== home_before (first 30 lines) ==="
          echo "$home_before" | head -30
          # Review fix LOW-2: `echo "$var" | wc -l` reports 1 for empty
          # because echo adds a trailing newline. printf '%s' gives the true
          # count.
          echo "=== home_before line count: $(printf '%s' "$home_before" | wc -l) ==="

          set +e
          bash ./bin/install.sh --dry-run --yes > /tmp/dry-run.log 2>&1
          install_rc=$?
          set -e

          home_after=$(snapshot)

          echo ""
          echo "=== install.sh exit code: $install_rc ==="

          echo ""
          echo "=== /tmp/dry-run.log (full) ==="
          cat /tmp/dry-run.log
          echo "=== end of /tmp/dry-run.log ==="

          fail=0

          if [ "$home_before" != "$home_after" ]; then
            echo ""
            echo "=== ASSERTION FAILED: FS CHANGED under --dry-run ==="
            echo "--- diff (before -> after) ---"
            diff <(echo "$home_before") <(echo "$home_after") || true
            fail=1
          fi

          if ! grep -q '\[DRY-RUN\]' /tmp/dry-run.log; then
            echo ""
            echo "=== ASSERTION FAILED: missing [DRY-RUN] marker in output ==="
            fail=1
          fi

          if ! grep -q 'dry-run complete' /tmp/dry-run.log; then
            echo ""
            echo "=== ASSERTION FAILED: missing 'dry-run complete' marker in output ==="
            fail=1
          fi

          if [ "$install_rc" -ne 0 ]; then
            echo ""
            echo "=== ASSERTION FAILED: install.sh exited $install_rc (expected 0) ==="
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo ""
          echo "=== All dry-run assertions passed ==="
