name: shellcheck

on:
  push:
    branches-ignore: ['gh-pages']
    tags-ignore: ['**']        # tag pushes already covered by the main commit; avoid duplicate runs
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0 (pinned for supply-chain hardening)
        with:
          scandir: './bin ./lib ./hooks'
          severity: warning
